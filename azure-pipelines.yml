# =====================================================================
# UiPath pack with NuGet feed lockdown
# Allow: pkgs.dev.azure.com (UiPath Official) + nuget.org  (both searched; no source mapping).
# Block everything else (gallery.uipath.com, Orchestrator/custom feeds, machine feeds).
# Uses the UiPath CLI directly so --excludeConfiguredSources can be applied
# (the UiPathPack@6 task does NOT expose that switch).
# =====================================================================

trigger:
  branches:
    include:
      - main           # CI: run on every push to main

pool:
  name: 'Default'              # self-hosted agent pool (org: dev.azure.com/pavankosuru)
  demands:
    - Agent.Name -equals DESKTOP-11Q1P0Q   # optional: pin to this specific agent; remove to use any agent in the pool

variables:
  system.debug: 'true'
  cliVersion: 'Windows.25.10.21'
  # UiPath CLI already installed on the self-hosted agent (no download needed)
  cliDll: 'C:\uipcli\25.10.21\tools\net8.0\any\uipcli.dll'
  # --- project (committed in this repo) ---
  projectJsonPath: '$(Build.SourcesDirectory)\BlankProcess_TestEntity\project.json'
  outputPath: '$(Build.ArtifactStagingDirectory)\Output'
  # --- feeds: UiPath.* from pkgs.dev.azure.com; transitive deps from nuget.org; all others blocked ---
  uipathOfficialFeed: 'https://pkgs.dev.azure.com/uipath/Public.Feeds/_packaging/UiPath-Official/nuget/v3/index.json'
  nugetOrgFeed: 'https://api.nuget.org/v3/index.json'

steps:

# 0) Clean checkout — self-hosted agents keep the workspace between runs
- checkout: self
  clean: true

# 0b) Remove ONLY the BalaReva package(s) from the NuGet global-packages cache.
#     Everything else stays cached, so the UiPath packages are NOT re-downloaded (fast restore),
#     while BalaReva is forced to be re-resolved from the feeds every run — and since it is on
#     neither allowed feed, it stays blocked. Demonstrates the lockdown without wiping the cache.
- task: PowerShell@2
  displayName: 'Remove BalaReva from NuGet cache (keep everything else)'
  inputs:
    targetType: 'inline'
    script: |
      $removed = $false
      Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Directory -Filter "balareva*" -ErrorAction SilentlyContinue | ForEach-Object {
        Write-Host "Removing cached package: $($_.Name)"
        Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
        $removed = $true
      }
      if (-not $removed) { Write-Host "No BalaReva* packages in cache (nothing to remove)." }

# 1) .NET 8 is already installed on this self-hosted agent (runtime 8.0.x present),
#    so the UseDotNet@2 install step is not needed. `dotnet uipcli.dll` only needs the .NET 8 runtime.

# 2) UiPath CLI — already installed on this self-hosted agent at $(cliDll).
#    (No UiPathInstallPlatform@6 download step; just verify it's present.)
- task: PowerShell@2
  displayName: 'Verify pre-installed UiPath CLI'
  inputs:
    targetType: 'inline'
    script: |
      if (-not (Test-Path "$(cliDll)")) { Write-Error "UiPath CLI not found at $(cliDll)"; exit 1 }
      dotnet "$(cliDll)" --version

# 3) Write the locked NuGet.config: ONLY the UiPath Official feed + nuget.org are listed.
#    No packageSourceMapping — NuGet searches BOTH feeds for every package. This is required
#    because UiPath activity packages pull transitive deps that are NOT named "UiPath.*"
#    (e.g. System.Activities.ViewModels) yet live on the UiPath Official feed; a UiPath.*->official /
#    *->nuget.org mapping mis-routes those to nuget.org (404) and the restore stalls/fails.
#    <clear/> + only these two sources still blocks gallery.uipath.com, Orchestrator and custom feeds.
- task: PowerShell@2
  displayName: 'Write locked NuGet.config (UiPath Official + nuget.org only)'
  inputs:
    targetType: 'inline'
    script: |
      $cfg = @"
      <?xml version="1.0" encoding="utf-8"?>
      <configuration>
        <packageSources>
          <clear />
          #<add key="UiPath-Official" value="$(uipathOfficialFeed)" />
          <add key="nuget.org"       value="$(nugetOrgFeed)" />
        </packageSources>
      </configuration>
      "@
      $path = Join-Path "$(Build.SourcesDirectory)" "NuGet.config"
      [System.IO.File]::WriteAllText($path, $cfg)
      Write-Host "Wrote $path"
      Get-Content $path

# 4) Pack with the CLI, restricted to ONLY the feeds in NuGet.config
- task: PowerShell@2
  displayName: 'Build nupkg (feed lockdown)'
  inputs:
    targetType: 'inline'
    script: |
      $cli = "$(cliDll)"
      Write-Host "Using CLI: $cli"
      dotnet "$cli" package pack "$(projectJsonPath)" `
        -o "$(outputPath)" `
        --outputType Process --traceLevel Verbose `
        --nugetConfigFilePath "$(Build.SourcesDirectory)\NuGet.config" `
        --excludeConfiguredSources
      if ($LASTEXITCODE -ne 0) { Write-Error "Pack failed (exit $LASTEXITCODE)"; exit $LASTEXITCODE }

# 5) Publish the produced .nupkg
- task: PublishBuildArtifacts@1
  displayName: 'Publish nupkg'
  inputs:
    PathtoPublish: '$(outputPath)'
    ArtifactName: 'nupkg'
